[project]
name = "quellz"
version = "0.1.0"
description = "Prompt-injection red-team and containment harness for tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quelin Zammit" }]
keywords = ["prompt-injection", "llm-security", "agent-security", "red-team", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
# Zero runtime dependencies is a design constraint, not an accident: a tool that argues for
# supply-chain restraint should not pull a compiled extension into its default install path.
# tests/test_packaging.py asserts this list stays empty.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.116"]

[project.scripts]
quellz = "quellz.cli:main"

[project.urls]
Homepage = "https://github.com/PNX89/QUELLZ"
Source = "https://github.com/PNX89/QUELLZ"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/quellz"]

[tool.ruff]
line-length = 100
# ruff defaults to py310; the package uses 3.11 syntax and StrEnum, so pin it explicitly.
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# The wheel ships py.typed and the metadata above claims Typing :: Typed, which is a promise to
# every consumer that these annotations hold, and nothing but a checker keeps a promise like that.
# Strict, and over the package rather than the whole tree, because the package is what the promise
# covers: the suite deliberately calls the adapter wrongly to assert what it refuses.
# `files` is set here rather than passed on the command line so that CI, CONTRIBUTING and a bare
# `uv run mypy` all check the same thing.
[tool.mypy]
files = ["src"]
strict = true
python_version = "3.11"

# The SDK is an optional extra and the 3.14 CI leg installs the zero dependency core alone, so
# on that leg the deferred `import anthropic` resolves to nothing. Its absence is the point of
# the leg rather than a defect, and this silences only the missing-import error: where the SDK
# IS installed, the adapter is checked against its real annotations.
[[tool.mypy.overrides]]
module = ["anthropic"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
