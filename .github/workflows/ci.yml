name: CI

# No job in this workflow requires ANTHROPIC_API_KEY, and no test touches the network:
# tests/conftest.py monkeypatches socket.socket to raise for the whole session, and the
# adapter test drives a stub client.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Two calls to the shared workflow rather than one, because the difference between them is an
  # argument this repository is making rather than a configuration detail.
  #
  # run-mypy is set on BOTH legs and defaults to false in the shared workflow, which is how
  # CONTRIBUTING came to call typing a gate while nothing here type checked. The wheel ships
  # py.typed, so the checker is what keeps that promise rather than decorating it.
  #
  # The shared legs themselves, lint, format and the suite, live in PNX89/.github and are pinned
  # to a tag rather than a moving branch. The decision behind the pipeline, and the five things it
  # deliberately does not gate, is at
  # https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md
  extras:
    name: with the adapter extra
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--all-extras --dev"
      run-mypy: true

  # 3.14 installs the zero dependency core ONLY, and that is the point of this leg rather than an
  # omission: it proves the core needs no wheels at all on the newest interpreter. The adapter
  # tests skip through pytest.importorskip, which is why the total here is lower and correct.
  core-only:
    name: zero dependency core alone
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.14"]'
      sync-args: "--dev"
      run-mypy: true
